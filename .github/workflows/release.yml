name: Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Target tag to publish release for'
        required: true
        type: string

permissions:
  contents: write

env:
  BUILT_DLL_PATH: 'src/bin/Release/net6.0/MalumMenu.dll'
  RELEASE_DLL_NAME: 'HyperMenu.dll'

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Project
        run: |
          dotnet restore
          dotnet build -c Release

      - name: Package Distributions
        run: |
          # Any NuGet dependency the build copies next to the mod has to travel with it.
          # Without it BepInEx cannot load the assembly, so features depending on it (e.g.
          # BugSplat crash uploads) fail at runtime instead of at load time. This walks the
          # build output rather than naming files, so a new dependency needs no change here.
          DEPS_DIR="$(dirname "$BUILT_DLL_PATH")"
          copy_deps() {
            for dll in "$DEPS_DIR"/*.dll; do
              [ -e "$dll" ] || continue
              name="$(basename "$dll")"
              [ "$name" = "$RELEASE_DLL_NAME" ] && continue
              [ "$name" = "MalumMenu.dll" ] && continue
              cp "$dll" "$1/$name"
              echo "  packaged dependency: $name"
            done
          }

          # Process Steam / Itch.io package
          unzip bep-steam.zip -d build_steam
          mkdir -p build_steam/BepInEx/plugins
          cp "$BUILT_DLL_PATH" "build_steam/BepInEx/plugins/$RELEASE_DLL_NAME"
          copy_deps "build_steam/BepInEx/plugins"
          cd build_steam && zip -r ../HyperMenu-Steam-Itch.zip . && cd ..

          # Process Epic Games / MS Store package
          unzip bep-epic.zip -d build_epic
          mkdir -p build_epic/BepInEx/plugins
          cp "$BUILT_DLL_PATH" "build_epic/BepInEx/plugins/$RELEASE_DLL_NAME"
          copy_deps "build_epic/BepInEx/plugins"
          cd build_epic && zip -r ../HyperMenu-Epic-MSStore.zip . && cd ..

          # Process Quick Update
          mkdir -p build_quick/BepInEx/plugins
          cp "$BUILT_DLL_PATH" "build_quick/BepInEx/plugins/$RELEASE_DLL_NAME"
          copy_deps "build_quick/BepInEx/plugins"
          cd build_quick && zip -r ../HyperMenu-Quick-Update.zip . && cd ..


      - name: Publish Release to GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag_name }}"
          fi

          # Any dependency DLLs sitting in the working root (dropped there by the
          # Package step) become extra assets, so the in-game auto-updater can fetch
          # them from releases/latest/download/ by name.
          EXTRA_ASSETS="$(ls -1 ./*.dll 2>/dev/null | grep -v "^./$RELEASE_DLL_NAME$" | tr '\n' ' ')"
          if [ -n "$EXTRA_ASSETS" ]; then
            echo "publishing dependency assets: $EXTRA_ASSETS"
          fi

          gh release create "$TAG" \
            --title "Release $TAG" \
            --generate-notes \
            "HyperMenu-Steam-Itch.zip" \
            "HyperMenu-Epic-MSStore.zip" \
            "HyperMenu-Quick-Update.zip" \