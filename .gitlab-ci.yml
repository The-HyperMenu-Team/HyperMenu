stages:
  - build
  - prepare
  - release

variables:
  BUILT_DLL_PATH: "src/bin/Release/net6.0/MalumMenu.dll"
  RELEASE_DLL_NAME: "HyperMenu.dll"
  # Exposed as an input field in GitLab UI under 'Build > Pipelines > Run pipeline'
  MANUAL_TAG:
    value: ""
    description: "Specify a tag name if running manually from a branch (leave blank if running directly on a tag)"

# Shared trigger rules
.release_rules:
  rules:
    # 1. Triggered by a tag push OR by selecting a tag from the 'Run pipeline' dropdown
    - if: $CI_COMMIT_TAG
    # 2. Triggered manually via Web UI with the MANUAL_TAG variable populated
    - if: $CI_PIPELINE_SOURCE == "web" && $MANUAL_TAG != ""

# -------------------------------------------------------------------
# STAGE 1: Build DLL, rename, and insert into base BepInEx ZIPs
# -------------------------------------------------------------------
build_mod:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:8.0
  rules:
    - !reference [.release_rules, rules]
  script:
    - dotnet restore
    - dotnet build -c Release

    # Ensure utility tools are present
    - apt-get update && apt-get install -y unzip zip

    # 1. Process Steam / Itch.io package
    - unzip bep-steam.zip -d build_steam
    - mkdir -p build_steam/BepInEx/plugins
    - cp $BUILT_DLL_PATH build_steam/BepInEx/plugins/$RELEASE_DLL_NAME
    - cd build_steam && zip -r ../HyperMenu-Steam-Itch.zip . && cd ..

    # 2. Process Epic Games / MS Store package
    - unzip bep-epic.zip -d build_epic
    - mkdir -p build_epic/BepInEx/plugins
    - cp $BUILT_DLL_PATH build_epic/BepInEx/plugins/$RELEASE_DLL_NAME
    - cd build_epic && zip -r ../HyperMenu-Epic-MSStore.zip . && cd ..

    # 3. Standalone DLL copy
    - cp $BUILT_DLL_PATH $RELEASE_DLL_NAME

  artifacts:
    paths:
      - HyperMenu.dll
      - HyperMenu-Steam-Itch.zip
      - HyperMenu-Epic-MSStore.zip
    expire_in: 30 days

# -------------------------------------------------------------------
# STAGE 2: Generate Release Notes & Resolve Tag Name
# -------------------------------------------------------------------
generate_changelog:
  stage: prepare
  image: alpine:latest
  rules:
    - !reference [.release_rules, rules]
  script:
    - apk add --no-cache git
    - git fetch --tags

    # Resolve active tag from either Git context or manual input
    - ACTIVE_TAG="${CI_COMMIT_TAG:-$MANUAL_TAG}"
    - echo "ACTIVE_TAG=${ACTIVE_TAG}" > active_tag.env

    # Find previous tag
    - PREV_TAG=$(git describe --tags --abbrev=0 "${ACTIVE_TAG}^" 2>/dev/null || echo "")
    - |
      if [ -z "$PREV_TAG" ]; then
        echo "## Release $ACTIVE_TAG" > release_notes.md
        echo "" >> release_notes.md
        git log --pretty=format:"* %s" "$ACTIVE_TAG" >> release_notes.md
      else
        echo "## Release $ACTIVE_TAG (Changes since $PREV_TAG)" > release_notes.md
        echo "" >> release_notes.md
        git log --pretty=format:"* %s" "${PREV_TAG}..${ACTIVE_TAG}" >> release_notes.md
      fi
  artifacts:
    # Exports ACTIVE_TAG as an environment variable to downstream jobs
    reports:
      dotenv: active_tag.env
    paths:
      - release_notes.md

# -------------------------------------------------------------------
# STAGE 3: Publish GitLab Release with renamed assets
# -------------------------------------------------------------------
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - !reference [.release_rules, rules]
  needs:
    - job: build_mod
      artifacts: true
    - job: generate_changelog
      artifacts: true
  script:
    - echo "Publishing release for $ACTIVE_TAG..."
  release:
    name: "Release $ACTIVE_TAG"
    description: 'release_notes.md'
    tag_name: '$ACTIVE_TAG'
    assets:
      links:
        - name: "HyperMenu.dll (Standalone Plugin)"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${ACTIVE_TAG}/raw/HyperMenu.dll?job=build_mod"
        - name: "BepInEx Package (Steam & Itch.io)"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${ACTIVE_TAG}/raw/HyperMenu-Steam-Itch.zip?job=build_mod"
        - name: "BepInEx Package (Epic Games & MS Store)"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${ACTIVE_TAG}/raw/HyperMenu-Epic-MSStore.zip?job=build_mod"